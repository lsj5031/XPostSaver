.native-icon { position:relative; width:28px; height:28px; flex-shrink:0 }

.compose { background:#eff3f4; color:#0f1419; width:90%; justify-content:center; margin:8px 0 }

main { width:calc(100% - 280px); flex:1; min-width:0 }

section { max-width:600px; margin-inline:auto }

article { min-height:190px; padding:14px; border:1px solid #536471; border-radius:16px; font-size:16px; }
[role=menu] { position:fixed; left:70px; bottom:30px; z-index:20; background:#253341; padding:20px; }
@media(max-width:1250px) {
  .native-control .native-label { display:none }
  .compose svg { display:block }
}
@media(max-width:999px) {
  header[role=banner],.native-width { width:88px; flex-basis:88px; }
  .page-wrap { padding-inline:0 }
  .native-pill { padding:0 }
}
